plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
}

dependencies {
    implementation project(':shared')
    implementation(compose.desktop.currentOs)
    implementation(compose.runtime)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.ui)
    implementation(compose.components.resources)
    
    // QR Generation
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
}

compose.desktop {
    application {
        mainClass = "com.prayershield.app.MainKt"
        nativeDistributions {
            targetFormats(org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe, org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi)
            packageName = "PrayerShield"
            packageVersion = "1.1.0"
            windows {
                shortcut = true
                menu = true
            }
        }
    }
}
